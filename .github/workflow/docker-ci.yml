name: Build and Update ScriptBoss Docker Image

on:
  push:
    branches:
      - main # Runs the pipeline automatically when you push modifications to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull code files from your repository into the runner environment
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup standard builder systems to structure caching configurations
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate securely against your global Docker Hub profile
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Compile layers, cache matching blocks, and push updated tags to cloud
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replaces 'yourusername' with your actual account name dynamically from secrets
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/script-boss-ai:latest